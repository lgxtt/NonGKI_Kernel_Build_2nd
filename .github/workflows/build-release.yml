name: Build and Release Kernel (Droidspaces)
permissions:
  contents: write
  actions: write
on:
  workflow_dispatch:
    inputs:
      build-kernel:
        description: 'Build Kernel ?'
        required: true
        type: boolean
        default: true
      release-kernel:
        description: 'Release Kernel ?'
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '0 3 * * 3'

jobs:
  build-kernel:
    name: "Step Build Kernel"
    uses: ./.github/workflows/build-kernel.yml
    secrets: inherit
    strategy:
      fail-fast: false
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build-kernel == true)

  release-kernel:
    name: "Step Release Kernel"
    runs-on: ubuntu-24.04
    needs:
      - build-kernel
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release-kernel == true)
    env:
      REPO_OWNER: lgxtt                       # ← 按你的实际情况核对（日志里你的仓库是 lgxtt）
      REPO_NAME: NonGKI_Kernel_Build_2nd      # ← 按你的实际情况核对
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: "Pre-built Droidspaces (LLD linked, Non-GKI, SUSFS off, containers enabled)"
      RELEASE_NOTES: |
        Below is the codename reference table. Please select the image or archive you need based on this table.

        | Device Name | Codename | Kernel | System | Android | Method | KernelSU | SUSFS | Defconfig Source |
        |----------|----------|----------|----------|----------|----------|----------|----------|----------|
        | Redmi 10X 4G / Redmi Note 9 | merlin | 4.14 (stock defconfig) | MIUI 12.5.3.0 | 11 | MKBOOTIMG | KernelSU-Next legacy | ❌ off | stock defconfig text (direct URL) |

        - This is the **Droidspaces** build: enables Linux container/LXC support on top of all previous fixes.
        - Fix 1: custom step downloads extracted 4.14.186 stock defconfig by ABSOLUTE path (framework's Get DEFCONFIG hardcodes a broken nested path device_kernel/device_kernel/... -> curl (23); DEFCONFIG_SOURCE is left empty to skip it).
        - Fix 2: SUSFS disabled by default (incompatible with Droidspaces; v1.5.5 also produced .rej on eleven/4.14.248). KernelSU root still works.
        - Fix 3: KernelSU fork switched bakasu -> KernelSU-Next legacy (Non-GKI compatible).
        - Fix 4: added `LD=ld.lld` to EXTRA_CMDS so the kernel links with LLD (GNU bfd ld caused relocation truncated to fit on __start_builtin_fw).
        - Fix 5: restored WiFi/BT connectivity configs lost by IKCONFIG extraction (MTK_COMBO_BT / BT / WLAN_DRV_BUILD_IN).
        - Fix 6 (this version): DROIDSPACES_ENABLE=true. Framework merges its droidspaces.config + 2 cocci patches automatically; requires SUSFS off + Magic Mount (not OverlayFS) + working root.
        - Full boot.img via MKBOOTIMG, inherits stock cmdline/addresses/dtb. OLD_ANDROID_SUPPORT applied.
        - Flash via fastboot; AVB must be disabled first (see README).
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Generate and Create New Tag
        run: |
          LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name')
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0000000001"
          fi
          NEW_TAG=$(date +%s)
          echo "New tag: $NEW_TAG"
          TIME=$(date +"%Y-%m-%d %H:%M")
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
          git tag $NEW_TAG
          git push --tags
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: false
          release_name: "${{ env.RELEASE_NAME }} ${{ env.TIME }}"
          body: ${{ env.RELEASE_NOTES }}

      - name: Upload Release Assets Dynamically
        run: |
          for file in ./downloaded-artifacts/*; do
            if [ -d "$file" ]; then
              continue
            fi
            echo "Uploading $file..."
            gh release upload ${{ env.NEW_TAG }} "$file"
          done

      - name: Display Files Uploaded
        run: |
          echo "GitHub release created with the following files:"
          ls ./downloaded-artifacts/*
