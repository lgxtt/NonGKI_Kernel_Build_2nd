name: Build and Release Kernel (Stock Aligned)
permissions:
  contents: write
  actions: write
on:
  workflow_dispatch:
    inputs:
      build-kernel:
        description: 'Build Kernel ?'
        required: true
        type: boolean
        default: true
      release-kernel:
        description: 'Release Kernel ?'
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '0 3 * * 3'

jobs:
  build-kernel:
    name: "Step Build Kernel"
    uses: ./.github/workflows/build-kernel.yml
    secrets: inherit
    strategy:
      fail-fast: false
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build-kernel == true)

  release-kernel:
    name: "Step Release Kernel"
    runs-on: ubuntu-24.04
    needs:
      - build-kernel
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release-kernel == true)
    env:
      REPO_OWNER: lgxtt        # ← 改成你的 GitHub 用户名
      REPO_NAME: NonGKI_Kernel_Build_2nd        # ← 改成你 fork 后的仓库名
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: "Pre-built Stock Aligned"
      RELEASE_NOTES: |
        Below is the codename reference table. Please select the image or archive you need based on this table.

        | Device Name | Codename | Kernel | System | Android | Method | KernelSU | SUSFS | Defconfig Source |
        |----------|----------|----------|----------|----------|----------|----------|----------|----------|
        | Redmi 10X 4G / Redmi Note 9 | merlin | 4.14.186 (stock config) | MIUI 12.5.3.0 | 11 | MKBOOTIMG | BakaSU | ✅ | extracted from stock boot |

        - This is the **Stock Aligned** build: defconfig extracted directly from the stock boot.img (real 4.14.186 config), packed as a **full boot.img** inheriting stock cmdline/addresses/dtb.
        - OLD_ANDROID_SUPPORT applied (stock config already has CONFIG_SDCARD_FS=y).
        - Flash the full boot.img via fastboot; AVB must be disabled first (see README).
        - Specific device information: [Supported List](Supported_list.md).
        - The KernelSU version is for reference only. It is normal for the KernelSU version embedded in SUSFS to be lower.
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Generate and Create New Tag
        run: |
          LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name')
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0000000001"
          fi
          NEW_TAG=$(date +%s)
          echo "New tag: $NEW_TAG"
          TIME=$(date +"%Y-%m-%d %H:%M")
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
          git tag $NEW_TAG
          git push --tags
          git clone -b master https://github.com/backslashxx/KernelSU.git KernelSU-xxKSU
          KSU_XXKSU_VERSION=$(cd KernelSU-xxKSU && expr $(/usr/bin/git rev-list --count HEAD) + 30000 - 80)
          git clone -b main https://github.com/rsuntk/KernelSU.git KernelSU-rsuntk
          KSU_RSUNTK_VERSION=$(cd KernelSU-rsuntk && expr $(/usr/bin/git rev-list --count HEAD) + 29971)
          git clone -b builtin https://github.com/SukiSU-Nova/SukiSU-Nova.git KernelSU-SukiSU-Nova
          KSU_SUKISU_ULTRA_VERSION=$(cd KernelSU-SukiSU-Nova && expr $(/usr/bin/git rev-list --count HEAD) + 40000 - 2815)
          git clone -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          KSU_NEXT_VERSION=$(cd KernelSU-Next && expr $(/usr/bin/git rev-list --count HEAD) + 30000)
          git clone -b main https://github.com/Baka-SU/BakaSU.git KernelSU-BakaSU
          KSU_RESUKISU_VERSION=$(cd KernelSU-BakaSU && expr $(/usr/bin/git rev-list --count HEAD) + 30000 + 700)
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "[KernelSU-xxKSU](https://github.com/backslashxx/KernelSU) Version: $KSU_XXKSU_VERSION " >> $GITHUB_ENV
          echo "[KernelSU-rsuntk](https://github.com/rsuntk/KernelSU) Version: $KSU_RSUNTK_VERSION " >> $GITHUB_ENV
          echo "[KernelSU-SukiSU-Nova](https://github.com/SukiSU-Nova/SukiSU-Nova) Version: $KSU_SUKISU_ULTRA_VERSION " >> $GITHUB_ENV
          echo "[KernelSU-Next](https://github.com/KernelSU-Next/KernelSU-Next) Version: $KSU_NEXT_VERSION " >> $GITHUB_ENV
          echo "[KernelSU-BakaSU](https://github.com/Baka-SU/BakaSU) Version: $KSU_RESUKISU_VERSION " >> $GITHUB_ENV
          echo "[KernelSU-ReSukiSU-CI](https://github.com/cctv18/ReSukiSU_CI) Version: $KSU_RESUKISU_VERSION " >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: false
          release_name: "${{ env.RELEASE_NAME }} ${{ env.TIME }}"
          body: ${{ env.RELEASE_NOTES }}

      - name: Upload Release Assets Dynamically
        run: |
          for file in ./downloaded-artifacts/*; do
            if [ -d "$file" ]; then
              continue
            fi
            echo "Uploading $file..."
            gh release upload ${{ env.NEW_TAG }} "$file"
          done

      - name: Display Files Uploaded
        run: |
          echo "GitHub release created with the following files:"
          ls ./downloaded-artifacts/*
