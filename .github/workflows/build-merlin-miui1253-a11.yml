name: Build Merlin MIUI 12.5.3.0 Kernel (A11) - Droidspaces
on:
  workflow_call:
  workflow_dispatch:

env:
  # ---------- 设备标识与产物命名 ----------
  DEVICE_NAME: "merlin"
  DEVICE_CODENAME: "merlin"
  ROM_TEXT: "miui_12.5.3_a11_droidspaces"   # 第九版（开启 Droidspaces 容器支持，继承 WifiBtFix 全部修复）

  # ---------- ★ 编译修复①：原厂 defconfig 用"直链文本"而非从 boot 现场提取 ----------
  # 【为什么改】第三版用 DEFCONFIG_FROM_BOOT: true，但框架的 build-ready 里是
  #   `if [[ -f "${BOOT_SOURCE}" ]]` —— -f 判断一个 URL 永远是 false，
  #   导致 extract-ikconfig 整段被跳过，原厂 defconfig 根本没被提取！
  #   结果编译用了 eleven 分支自带配置（CONFIG_MTK_PRINTK_UART_CONSOLE 未开），
  #   触发 mtk_printk_ctrl.h 的 static/non-static 声明冲突。
  # 【本版做法】把我们已提取好的原厂 4.14.186 defconfig 文本（boot/merlin_stock_defconfig.txt，
  #   5153 行，含 CONFIG_MTK_PRINTK_UART_CONSOLE=y / CONFIG_SDCARD_FS=y）放进仓库，
  #   由下方自定义步骤用绝对路径下载到正确位置（DEFCONFIG_SOURCE 必须留空，见下）。
  DEFCONFIG_NAME: "merlin_stock_defconfig"   # 最终写入 configs/ 的文件名
  DEFCONFIG_FROM_BOOT: false
  DEFCONFIG_ORIGIN_IMAGE: ""
  # ★ 关键：这里必须留空！框架的 Get DEFCONFIG 步骤有路径 bug：
  #   它先 `cd device_kernel`，却把下载目标写成 device_kernel/arch/... → 变成
  #   device_kernel/device_kernel/... 不存在的嵌套目录 → curl (23) 失败（你这次的报错）。
  #   留空可让该 bug 步骤整段跳过，改由下面自定义步骤用绝对路径下载到正确位置。
  DEFCONFIG_SOURCE: ""
  STOCK_DEFCONFIG_URL: "https://raw.githubusercontent.com/lgxtt/NonGKI_Kernel_Build_2nd/merlin-stock-aligned/boot/merlin_stock_defconfig.txt"  # 原厂defconfig直链（自定义步骤用）

  # ---------- ★ 完整 boot.img 打包（继承原厂 cmdline/地址/页大小/dtb）----------
  PACK_METHOD: "MKBOOTIMG"
  # BOOT_SOURCE 必须是 GitHub Actions 能下载的 URL（已按你的实际仓库填好）。
  # 你日志里用的是 boot/boot.img，这里保持一致；若文件名不同请自行核对。
  BOOT_SOURCE: "https://raw.githubusercontent.com/lgxtt/NonGKI_Kernel_Build_2nd/merlin-stock-aligned/boot/boot.img"

  # ---------- 内核源码 ----------
  # 注意：本版用原厂 defconfig，内核源码仍需提供 4.14 源码树用于编译。
  # eleven 分支（4.14.248）与原厂 4.14.186 同属 4.14，配原厂 defconfig 兼容性最佳。
  KERNEL_SOURCE: "https://github.com/Redmi-MT6768/android_kernel_xiaomi_mt6768.git"
  KERNEL_BRANCH: "eleven"

  # ---------- 工具链（对齐原厂 Clang 11 系；kdrag0n proton-clang 为 AOSP Clang 11 衍生）----------
  CLANG_SOURCE: "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH: "master"
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu- SUBARCH=arm64"
  # 【第七版核心修复④】用 LLD 链接，修 relocation truncated to fit 错误。
  # 【为什么】第六版编译到最后 LD vmlinux 阶段报：
  #   drivers/base/firmware_class.c: relocation truncated to fit:
  #   R_AARCH64_LDST64_ABS_LO12_NC against symbol `__start_builtin_fw'
  #   根因：框架 make 命令没传 LLVM/LD，链接用的是 CROSS_COMPILE 的 aarch64-linux-gnu-ld（GNU bfd），
  #   它对 MTK 老内核里的大量 builtin firmware 数组做不出正确的页内重定位；原厂内核是用 LLD 编译的。
  # 【如何生效】内核 Makefile: `ld-name = $(shell $(LD) -v | grep LLD)`，
  #   传 LD=ld.lld → ld-name=lld → 触发 `KBUILD_CFLAGS += -fuse-ld=lld` → 用 LLD 链接。
  #   proton-clang 自带 ld.lld，PATH 已含 clang-custom/bin（框架已设置）。
  EXTRA_CMDS: "LOCALVERSION=-Merlin-12.5.3-Droidspaces LD=ld.lld"   # ← 保留 LLD 链接修复 + 新版本标识
  GCC_GNU: false
  GCC_64_SOURCE: ""
  GCC_64_BRANCH: ""
  GCC_32_SOURCE: ""
  GCC_32_BRANCH: ""

  # ---------- KernelSU 与 SUSFS ----------
  # 提醒：原厂内核 4.14.186 + 提取的 defconfig，SUSFS 补丁针对 4.14 大版本通用，
  # 但原厂源码行号可能与补丁上下文略有差异。若编译报 .rej，先把 SUSFS_ENABLE 改 false
  # 确保能开机，再决定是否换更匹配的补丁。
  # 【第六版核心修复③】换 KernelSU fork：bakasu -> next
  # 【为什么换】第五版 bakasu v4.2.0-rc3 强制使用 TP Hook（Tracepoint Syscall Redirect Hook），
  #   它的 Kbuild 里写死了 `$(error TP hooks are incompatible with Non-GKI/GKI 1.0 kernels.)`，
  #   而本机 4.14 内核是 Non-GKI → 编译到 drivers/kernelsu 直接 Stop（你这次的报错）。
  #   这与 HOOK_METHOD:syscall 无关（那是给内核打的 no-kprobe 补丁）。
  # 【为什么用 next】框架的 next = KernelSU-Next 的 legacy 分支，专为 Non-GKI 老内核设计：
  #   - 无 TP Hook 强制检查；
  #   - SUSFS_ENABLE:false 时框架自动选 legacy 分支（已核实 build-ready 逻辑）；
  #   - 配套 HOOK_METHOD:syscall 的 manual hook 补丁，逻辑自洽。
  # 【退路】若 next 仍失败，把 KERNELSU_AUTO_GET 改 "false" 出纯原厂内核（无root，但必能开机）。
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "next"                 # ← 关键：KernelSU-Next legacy（Non-GKI 专用）
  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_METHOD: "shell"
  # 【编译修复②】第三版 SUSFS v1.5.5 通用补丁打到 eleven(4.14.248) 时：
  #   fs/proc/task_mmu.c 3 个 hunk、fs/notify/fdinfo.c 1 个 hunk 失败 → .rej
  #   且因 BUILD_DEBUGGER:false，rej 没被拦截，带病编译 → SUSFS_IS_INODE_* 未定义报错。
  #   本版默认关闭 SUSFS 先保证"能编译、能开机"；KernelSU(root) 保留不受影响。
  #   若日后要开 SUSFS，需换用与该内核匹配的补丁（见 README）。
  SUSFS_ENABLE: false                        # ← 关键：默认关闭，先出可开机包
  SUSFS_FIXED: false
  HOOK_METHOD: "syscall"
  SKIP_PATCH: false
  BUILD_DEBUGGER: true                       # ← 打开：失败时打包 .rej 便于排查
  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  # ---------- 功能模块开关 ----------
  REKERNEL_ENABLE: "false"
  # 【第九版核心改动】开启 Droidspaces（Linux 容器/LXC 运行时）支持。
  # 框架链路已核实完整：
  #   1) patch-droidspaces action 会把自带的 droidspaces.config(126 行) 拷进内核 configs/，
  #      并打两个 cocci 补丁（xt_qtaguid 内核崩溃、cgroup 文件前缀），仅当此值为 true 时执行；
  #   2) build-process 会用 merge_config.sh 把 droidspaces.config 合并进 out/.config，
  #      再跑 olddefconfig 自动解析依赖 → 原厂 defconfig 缺失的 IPC_NS/CGROUP_DEVICE/
  #      NF_TABLES/DEVTMPFS 等约 20 项会被自动补齐，无需手动改 defconfig。
  # 【前置条件】SUSFS 必须保持 false（官方明确不兼容）；KernelSU 用 Magic Mount 而非 OverlayFS
  #   （当前 HOOK_METHOD:syscall + manual hook 符合）；需要 root 可用（已验证）。
  DROIDSPACES_ENABLE: "true"                 # ← 关键：开启容器支持
  NOMOUNT_ENABLE: "false"
  FGETPRIORITY_ENABLE: "false"
  VPNHIDE_ENABLE: "false"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "mediatek"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  # ---------- ★ K419 机型优化（原厂配置已含 SDCARD_FS=y，此处幂等兜底）----------
  OLD_ANDROID_SUPPORT: "true"
  FIX_WIFI_SPEED: "false"

  # ---------- 环境 ----------
  PACK_KMODULES: "false"
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  PYTHON_VERSION: "3"
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Redmi 10X 4G (MIUI 12.5.3 / A11) Droidspaces
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6
      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env
      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready
      # ★ 绕过框架 Get DEFCONFIG 的路径 bug：用绝对路径直接下载原厂 defconfig。
      - name: 📥 Place stock defconfig (bypass framework path bug)
        run: |
          set -e
          DEST="$GITHUB_WORKSPACE/device_kernel/arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
          mkdir -p "$(dirname "$DEST")"
          echo "[+] Downloading stock defconfig -> $DEST"
          curl -fL --retry 4 --retry-delay 2 --retry-all-errors "${{ env.STOCK_DEFCONFIG_URL }}" -o "$DEST"
          LINES=$(wc -l < "$DEST")
          echo "[+] defconfig lines: $LINES"
          if [ "$LINES" -lt 1000 ]; then
            echo "[-] ERROR: defconfig too small, download may have failed"
            exit 1
          fi
          grep -q '^CONFIG_MTK_PRINTK_UART_CONSOLE=y' "$DEST" && echo "[+] MTK_PRINTK_UART_CONSOLE=y OK"
          grep -q '^CONFIG_SDCARD_FS=y' "$DEST" && echo "[+] SDCARD_FS=y OK"
          echo "[+] Stock defconfig placed successfully."
      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs
      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe
      - name: 🪛 Extra Kernel Options (K419 + BuildFix + KSU-Next + LinkFix + WifiBtFix + Droidspaces)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          DEFCONFIG="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

          # ============ 【第八版核心修复 WifiBtFix】补回 IKCONFIG 提取丢失的 connectivity 配置 ============
          # 【症状】LinkFix 能开机，但 WiFi 打不开、蓝牙打不开。
          # 【根因】我们用的 defconfig 是从原厂 boot.img 的 IKCONFIG 提取的，提取过程丢失了 3 个关键项。
          #   对比内核源码官方 merlin_defconfig(eleven) 确认，LK 包缺以下几项：
          #     CONFIG_MTK_COMBO_BT=y      -> MTK combo 蓝牙驱动（漏了 => 蓝牙起不来）
          #     CONFIG_BT=y                -> Linux 蓝牙协议栈（漏了 => 蓝牙起不来）
          #     CONFIG_WLAN_DRV_BUILD_IN=y -> WiFi 驱动内建进内核（漏了 + PACK_KMODULES=false => WiFi 起不来）
          #   原厂提取的 defconfig 里 MTK_COMBO_BT / BT 是 "# ... is not set"，
          #   WLAN_DRV_BUILD_IN 则完全不存在，所以三样驱动都没有被编译进内核。
          # 【修复】编译前把它们补回 defconfig（幂等：已是 y 则跳过，否则替换 not-set 或直接追加）。
          echo "[+] WifiBtFix: restore connectivity config (WiFi/BT/FM)..."
          # 蓝牙 combo 驱动
          grep -q '^CONFIG_MTK_COMBO_BT=y' "$DEFCONFIG" \
            || sed -i 's/^# CONFIG_MTK_COMBO_BT is not set/CONFIG_MTK_COMBO_BT=y/' "$DEFCONFIG"
          grep -q '^CONFIG_MTK_COMBO_BT=y' "$DEFCONFIG" || echo 'CONFIG_MTK_COMBO_BT=y' >> "$DEFCONFIG"
          # 蓝牙协议栈
          grep -q '^CONFIG_BT=y' "$DEFCONFIG" \
            || sed -i 's/^# CONFIG_BT is not set/CONFIG_BT=y/' "$DEFCONFIG"
          grep -q '^CONFIG_BT=y' "$DEFCONFIG" || echo 'CONFIG_BT=y' >> "$DEFCONFIG"
          # WiFi 驱动内建
          grep -q '^CONFIG_WLAN_DRV_BUILD_IN=y' "$DEFCONFIG" || echo 'CONFIG_WLAN_DRV_BUILD_IN=y' >> "$DEFCONFIG"
          # 校验：三项必须都在且为 y
          echo "[+] WifiBtFix connectivity config check:"
          grep -E '^CONFIG_(MTK_COMBO_BT|BT|WLAN_DRV_BUILD_IN)=y' "$DEFCONFIG"
          for MUST in CONFIG_MTK_COMBO_BT CONFIG_BT CONFIG_WLAN_DRV_BUILD_IN; do
            grep -q "^${MUST}=y" "$DEFCONFIG" || { echo "[-] FATAL: $MUST missing, abort"; exit 1; }
          done
          echo "[+] WifiBtFix: connectivity config OK"

          # [K419 / OLD_ANDROID_SUPPORT] 原厂 defconfig 已含 CONFIG_SDCARD_FS=y，
          # 这里做幂等兜底，防止个别提取结果缺失。
          if [ "${{ env.OLD_ANDROID_SUPPORT }}" = "true" ]; then
            echo "[+] K419/OLD_ANDROID_SUPPORT check (stock defconfig should already have sdcardfs)"
            if [ -f fs/sdcardfs/Kconfig ]; then
              sed -i '/^config SDCARD_FS$/,/^$/ s/^\([[:space:]]*\)default n$/\1default y/' fs/sdcardfs/Kconfig
            fi
            grep -q '^CONFIG_SDCARD_FS=y' "$DEFCONFIG" || echo 'CONFIG_SDCARD_FS=y' >> "$DEFCONFIG"
            grep -q '^CONFIG_MMC_CRYPTO_LEGACY=y' "$DEFCONFIG" || echo 'CONFIG_MMC_CRYPTO_LEGACY=y' >> "$DEFCONFIG"
            echo "[+] sdcardfs / mmc crypto legacy OK"
          fi

          # [K419 / FIX_WIFI_SPEED] 默认关闭
          if [ "${{ env.FIX_WIFI_SPEED }}" = "true" ]; then
            echo "[+] K419/FIX_WIFI_SPEED: rollback connectivity"
            CONN_DIR="drivers/misc/mediatek/connectivity"
            if [ -d "$CONN_DIR" ]; then
              rm -rf "$CONN_DIR"
              git clone https://github.com/Jbub5/connectivity.git --depth=1 "$CONN_DIR"
            fi
          fi

          # proton-clang host ld 改名（保留踩坑处理）
          if [ -f "$GITHUB_WORKSPACE/clang-custom/bin/ld" ]; then
            mv "$GITHUB_WORKSPACE/clang-custom/bin/ld" "$GITHUB_WORKSPACE/clang-custom/bin/ld.proton.host.bak"
            echo "[+] sidelined proton host ld"
          fi
      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel
      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces
      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard
      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount
      - name: ⛔ Patch Kernel of fgetpriority
        uses: ./.github/workflows/patch-fgetpriority
      - name: 🛜 Patch Kernel of VPNHide
        uses: ./.github/workflows/patch-vpnhide
      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process
      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process
      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
